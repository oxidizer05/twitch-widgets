<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Medvedev Denis (raziEiL)">
    <title>Twitch Voting Widget</title>
    <link rel="stylesheet" href="css/vote.min.css">
</head>

<body class="widget-body vote-body anim-fade-in hidden">
    <main class="widget-shell">
        <section class="widget widget--vote">
            <header class="widget__header">
                <div>
                    <p class="widget__eyebrow">Голосование чата</p>
                    <h1 class="widget__title" data-role="headline">Ожидаем команду !vote</h1>
                </div>
                <span class="widget__status" data-role="status">Подключаемся…</span>
            </header>
            <p class="widget__subtitle">Ведущий запускает голосование, а зрители выбирают победителя при помощи команд чата Twitch.</p>
            <section class="vote-meta">
                <p class="vote-meta__total" data-role="total">0 голосов</p>
                <p class="vote-meta__winner" data-role="winner-message"></p>
            </section>
            <section class="vote-options">
                <article class="vote-option" data-option="a">
                    <header class="vote-option__header">
                        <span class="vote-option__label" data-role="label">Участник A</span>
                        <span class="vote-option__command color-a" data-role="command">!A</span>
                    </header>
                    <div class="vote-option__progress">
                        <div class="vote-option__progress-fill color-bg-a" data-role="bar"></div>
                    </div>
                    <footer class="vote-option__footer">
                        <span class="vote-option__percent" data-role="percent">0%</span>
                        <span class="vote-option__count" data-role="count">0</span>
                    </footer>
                </article>
                <article class="vote-option" data-option="b">
                    <header class="vote-option__header">
                        <span class="vote-option__label" data-role="label">Участник B</span>
                        <span class="vote-option__command color-b" data-role="command">!B</span>
                    </header>
                    <div class="vote-option__progress">
                        <div class="vote-option__progress-fill color-bg-b" data-role="bar"></div>
                    </div>
                    <footer class="vote-option__footer">
                        <span class="vote-option__percent" data-role="percent">0%</span>
                        <span class="vote-option__count" data-role="count">0</span>
                    </footer>
                </article>
            </section>
            <footer class="widget__footer">
                <p class="widget__footnote">Поделитесь виджетом в OBS и укажите прозрачный фон для интеграции в трансляцию.</p>
            </footer>
        </section>
    </main>
    <script src="js/theme.min.js"></script>
    <script src="js/vote.min.js"></script>
</body>

</html>
