<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Medvedev Denis (raziEiL)">
    <title>Twitch Drawing Widget</title>
    <link rel="stylesheet" href="css/draw.min.css">
</head>

<body class="widget-body draw-body anim-fade-in hidden">
    <main class="widget-shell">
        <section class="widget widget--draw">
            <header class="widget__header">
                <div>
                    <p class="widget__eyebrow">Розыгрыш сообщества</p>
                    <h1 class="widget__title" data-role="headline">Подготовка к розыгрышу</h1>
                </div>
                <span class="widget__status" data-role="status">Подключаемся…</span>
            </header>
            <p class="widget__subtitle" data-role="description">Стример ещё не запустил розыгрыш. Следите за чатом, чтобы не пропустить старт!</p>
            <section class="draw-stats">
                <div class="draw-stat">
                    <p class="draw-stat__label">Участников</p>
                    <p class="draw-stat__value" data-role="count">0</p>
                </div>
                <div class="draw-stat">
                    <p class="draw-stat__label">Осталось</p>
                    <p class="draw-stat__value draw-stat__value--timer" data-role="timer">00:00</p>
                </div>
                <div class="draw-stat">
                    <p class="draw-stat__label">Команда</p>
                    <p class="draw-stat__value draw-stat__value--command color-a" data-role="command">!draw</p>
                </div>
            </section>
            <section class="draw-winner hidden" data-role="winner">
                <p class="draw-winner__label">Победитель</p>
                <p class="draw-winner__name" data-role="winner-name"></p>
            </section>
            <footer class="widget__footer">
                <p class="widget__footnote">Добавьте страницу в OBS как браузерный источник и отрегулируйте размер блока под дизайн трансляции.</p>
            </footer>
        </section>
    </main>
    <script src="js/theme.min.js"></script>
    <script src="js/draw.min.js"></script>
</body>

</html>
